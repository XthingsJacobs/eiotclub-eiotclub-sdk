workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH
    - when: never

stages:
  - test
  - sync

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"

test:
  stage: test
  image: composer:2
  script:
    - composer install --no-interaction --no-progress
    - composer test --no-interaction
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH

sync:github:
  stage: sync
  image: alpine:3.20
  needs:
    - job: test
      optional: true
  before_script:
    - apk add --no-cache git openssh-client
    - git config --global user.email "jacobs@xthings.com"
    - git config --global user.name "jacobs"
  script:
    - >
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "Missing GITHUB_TOKEN (GitHub personal access token with repo write permission)" >&2;
        exit 1;
      fi
    - github_url="https://${GITHUB_TOKEN}@github.com/XthingsJacobs/eiotclub-eiotclub-sdk.git"
    - git remote add github "${github_url}"
    - git fetch --unshallow || true
    - git fetch --tags origin
    - git fetch origin +refs/heads/main:refs/remotes/origin/main
    - git checkout -B github-main refs/remotes/origin/main
    - git rm -f --ignore-unmatch .gitlab-ci.yml tags.sh llms.txt
    - git diff --cached --quiet || git commit -m "chore: sanitize files for GitHub mirror"
    - git push --force github "HEAD:refs/heads/main"
    - git checkout -B github-tag "${CI_COMMIT_TAG}"
    - git rm -f --ignore-unmatch .gitlab-ci.yml tags.sh llms.txt
    - git diff --cached --quiet || git commit -m "chore: sanitize release ${CI_COMMIT_TAG} for GitHub mirror"
    - git tag -d "${CI_COMMIT_TAG}" || true
    - git tag "${CI_COMMIT_TAG}"
    - git push github ":refs/tags/${CI_COMMIT_TAG}" || true
    - git push github "refs/tags/${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
